<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Short videos by Nick Goergen: music films, product spots and launch clips.">
  <title>Portfolio · Nick Goergen</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="media/fonts/eb-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="spec-reel.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#pieces">Skip to the work</a>
  <header class="hero">
    <div class="stage" id="stage">
      <canvas id="geo" aria-hidden="true"></canvas>
      <video id="scene" muted loop playsinline preload="none" hidden aria-hidden="true"></video>
      <button id="tv" class="tv-hotspot" type="button" aria-label="Open the viewer and watch the work" hidden><span>Watch</span></button>
    </div>
    <div class="hero-copy">
      <p class="byline">Nick Goergen <span aria-hidden="true">·</span> <a href="https://nickdidit.net/">nickdidit.net</a></p>
      <h1>Portfolio</h1>
      <button id="open-viewer" class="cta" type="button">Watch the work <span class="tri" aria-hidden="true"></span></button>
    </div>
  </header>
  <main class="spec-reel">
    <section class="intro">
      <p class="eyebrow">Independent concepts</p>
      <p class="lead">Short videos: music films, product spots and launch clips, built with code, 3D and AI.</p>
      <p class="links">
        <a class="contact" href="https://www.upwork.com/freelancers/~016a59fef2b0e52da1" target="_blank" rel="noopener">Hire on Upwork</a>
        <a class="contact" href="https://nickdidit.net/" target="_blank" rel="noopener">More projects</a>
        <a class="contact" href="mailto:NickOnLocation@proton.me">Contact</a>
      </p>
    </section>
    <section aria-labelledby="work-heading" id="pieces" tabindex="-1">
      <div class="collection-heading">
        <h2 id="work-heading">The pieces</h2>
        <p id="piece-count" class="small"></p>
      </div>
      <p id="load-status" class="small" role="status">Loading the work…</p>
      <div id="piece-grid" class="piece-grid"></div>
      <noscript><p>Enable JavaScript to view this collection. You can also <a href="mailto:NickOnLocation@proton.me">contact Nick</a> for samples.</p></noscript>
    </section>
  </main>

  <dialog id="viewer" class="viewer" aria-label="Viewer">
    <div class="viewer-top">
      <p class="viewer-count" id="v-count"></p>
      <button class="v-close" id="v-close" type="button" aria-label="Close viewer">✕</button>
    </div>
    <div class="viewer-body">
      <button class="v-nav" id="v-prev" type="button" aria-label="Previous piece">‹</button>
      <div class="v-media" id="v-media"></div>
      <button class="v-nav" id="v-next" type="button" aria-label="Next piece">›</button>
    </div>
    <div class="v-caption">
      <p class="v-tag" id="v-tag"></p>
      <h2 id="v-title"></h2>
      <p id="v-desc"></p>
    </div>
    <div class="v-strip" id="v-strip" role="group" aria-label="Choose a piece"></div>
  </dialog>
</body>
</html>
